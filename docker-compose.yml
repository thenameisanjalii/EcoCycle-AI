version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecocycle-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
    volumes:
      - .:/app
    command: uvicorn backend.app.api.main:app --host 0.0.0.0 --port 8000 --reload
