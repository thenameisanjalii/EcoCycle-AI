[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecocycle-ai"
version = "0.1.0"
description = "EcoCycle AI: Intelligent Battery Second-Life Assessment, SOH and RUL Prediction System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "joblib>=1.3.0",
    "torch>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]
